# Build the CTI Platform console image from the BEACON repository root.
# Submit from beacon/:
#   gcloud builds submit . \
#     --config=cloudbuild.cti-console.yaml \
#     --substitutions=_IMAGE=${IMAGE},_TRACE_REF=cdc133cc7b5b4ae30f3831c42d322c8f13f2932c

substitutions:
  _IMAGE: "cti-console:dev"
  _TRACE_REF: "cdc133cc7b5b4ae30f3831c42d322c8f13f2932c"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cti-console
      - --build-arg
      - TRACE_REF=${_TRACE_REF}
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

images:
  - ${_IMAGE}
