# Build the CTI Platform console image from the BEACON repository root.
# Submit from beacon/:
#   gcloud builds submit . \
#     --config=cloudbuild.cti-console.yaml \
#     --substitutions=_IMAGE=${IMAGE},_TRACE_REF=v3.0.1

substitutions:
  _IMAGE: "cti-console:dev"
  _TRACE_REF: "v3.0.1"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cti-console
      - --build-arg
      - TRACE_REF=${_TRACE_REF}
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

images:
  - ${_IMAGE}
