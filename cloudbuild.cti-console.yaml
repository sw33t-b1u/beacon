# Build the CTI Platform console image from the BEACON repository root.
# Submit from beacon/ (TRACE_REF defaults to the latest TRACE main):
#   gcloud builds submit . \
#     --config=cloudbuild.cti-console.yaml \
#     --substitutions=_IMAGE=${IMAGE}
# Pin a specific TRACE commit/tag for reproducible builds:
#   ... --substitutions=_IMAGE=${IMAGE},_TRACE_REF=<commit-or-tag>

substitutions:
  _IMAGE: "cti-console:dev"
  _TRACE_REF: "main"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile.cti-console
      - --build-arg
      - TRACE_REF=${_TRACE_REF}
      - -t
      - ${_IMAGE}
      - .
  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_IMAGE}

images:
  - ${_IMAGE}
