[project]
name = "beacon"
version = "4.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "google-genai>=1.0",
    "structlog>=24.4.0",
    "httpx2>=2.4.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.31",  # CVE-2026-53538/-53539/-53540 fix
    "jinja2>=3.1.0",
    "cryptography>=48.0.1",  # GHSA-537c-gmf6-5ccf fix; transitive via google-genai/uvicorn
    "python-dotenv>=1.0",  # load .env into os.environ at startup
    "idna>=3.18",  # httpx2 requires idna>=3.18 (includes CVE-2026-45409 fix from 3.15); transitive via anyio/httpx2
    "starlette>=1.3.1",  # CVE-2026-48817/-48818/-54282/-54283 fix; transitive via fastapi
    "click>=8.1.0",  # Unified CLI entry (Initiative H Phase 6)
    "google-cloud-storage>=2.18.0",  # GCS StorageBackend (was optional [gcs] until BEACON 2.1.2)
    "google-auth>=2.0.0",  # Cloud Run service-to-service OIDC ID tokens for SAGE (BEACON 3.0.2; was transitive via google-cloud-storage)
]

[project.scripts]
beacon = "beacon.cli:cli"

[project.optional-dependencies]
dev = [
    "ruff>=0.6.0",
    "pytest>=9.0.3",
    "pytest-cov>=5.0.0",
    "pip-audit>=2.7.0",
    "pip>=26.1.2",  # PYSEC-2026-196 + CVE-2026-6357 fix; transitive via pip-audit -> pip-api
    "jsonschema>=4.23.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: marks tests that require real Vertex AI (run with: pytest -m integration)",
]
