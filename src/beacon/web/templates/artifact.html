{% extends "base.html" %}
{% block title %}{{ filename }} — Artifact Viewer{% endblock %}
{% block content %}
<h1>Artifact: {{ filename }}</h1>
<div class="card">
  <p style="font-size:0.88rem; color:#555;">
    <strong>Kind</strong>: {{ viewer_kind }}
    &nbsp;&nbsp;<strong>Size</strong>: {{ size_bytes }} B
    &nbsp;&nbsp;<a href="/review/artifacts/{{ filename }}/raw">Download raw</a>
    &nbsp;&nbsp;<a href="/">Back to landing</a>
  </p>
  <pre style="background:#f8f8fa; border:1px solid #e0e0e8; border-radius:4px; padding:1rem; overflow:auto; max-height:70vh; font-size:0.82rem; line-height:1.4;">{{ display_text }}</pre>
</div>
{% endblock %}
